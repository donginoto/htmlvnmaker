  const el=document.getElementById('studio');

ata-action="redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행">↷</button></div></div><div class="block-adders" aria-label="블록 추가">${C.TYPES.filter(t=>t!=='scene').map(t=>`<button data-add="${t}">+ ${NAMES[t]}</button>`).join('')}</div><div class="bulk-bar"><span class="selection-count">0개 선택</span><button class="small" data-action="select-scene">현재 챕터 전체 선택</button><button class="small quiet" data-action="clear-selection">선택 해제</button><button class="small" data-action="bulk-edit">일괄 변경</button><button class="small danger" data-action="bulk-delete">선택 삭제</button></div><div class="block-list" role="list" aria-label="대본 블록 목록"></div></section></main><aside class="inspector"><p class="inspector-heading">BLOCK PROPERTIES</p><div class="inspector-body"></div></aside></div><main class="asset-workspace" id="assets-view" hidden></main><input id="txt-input" type="file" accept=".txt,text/plain" hidden><dialog class="modal txt-dialog"><div class="modal-head"><h2>TXT 대본 가져오기</h2><button data-close>닫기 ×</button></div><div class="modal-body"><p>이름: 대사 → 대사 블록 · 내레이션: 내용 → 내레이션 블록<br>콜론 없는 줄은 앞 블록에 이어 붙입니다. 빈 줄로 구분하면 새 내레이션이 됩니다.</p><div class="row"><button data-action="choose-txt">TXT 파일 열기</button><select data-txt-encoding aria-label="파일 인코딩"><option value="utf-8">UTF-8</option><option value="euc-kr">EUC-KR / CP949</option></select></div><label>새 챕터 이름<input data-txt-title value="가져온 대본"></label><label>대본 내용<textarea data-txt-source rows="10" placeholder="라파엘: 안녕하세요.&#10;사탄: 반갑습니다.&#10;&#10;내레이션: 문이 열렸다."></textarea></label><p class="txt-summary"></p><div class="txt-preview"></div><p class="hint">기존 캐릭터는 이름이 같으면 재사용합니다. 새 캐릭터의 스탠딩 이미지는 가져온 뒤 등록하세요. 기존 대본 뒤에 새 챕터로 추가되며 Ctrl+Z로 되돌릴 수 있습니다.</p><button class="primary" data-action="apply-txt">블록으로 추가</button></div></dialog><input id="project-input" type="file" accept=".json,application/json" hidden><input id="font-input" type="file" accept=".woff,.woff2,.ttf,.otf" hidden><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><dialog class="modal bulk-dialog"><div class="modal-head"><h2>선택 블록 일괄 변경</h2><button data-close>닫기 ×</button></div><div class="modal-body bulk-form"></div></dialog><dialog class="modal project-settings"><div class="modal-head"><h2>테마 · 글자</h2><button data-close>닫기 ×</button></div><div class="modal-body project-form"></div></dialog><dialog class="modal publish-dialog"><div class="modal-head"><h2>공개용 HTML 내보내기</h2><button data-close>닫기 ×</button></div><div class="modal-body"><p>대본과 이미지가 포함된 <strong>index.html</strong> 하나로 작품을 공유합니다.</p><ol><li>아래 버튼으로 공개용 파일을 저장합니다.</li><li>GitHub 저장소에 <strong>index.html만</strong> 올립니다.</li><li>Settings → Pages에서 main / (root)를 선택합니다.</li><li>생성된 GitHub Pages 주소를 공유합니다.</li></ol><p class="muted">이 파일에는 편집 화면이 없습니다. 편집기 자체를 공유하려면 editor.html을 별도로 올리세요. 각자의 작업은 각자의 브라우저에 저장됩니다.</p><p class="muted small-text">공개 웹페이지의 대본과 이미지는 방문자가 내려받을 수 있습니다. 방문자가 원본 작품을 수정할 권한은 생기지 않습니다.</p><p class="export-size muted small-text"></p><button class="primary" data-action="download-viewer">공개용 index.html 저장 ↓</button></div></dialog><dialog class="modal play-dialog"><div class="modal-head"><h2>재생 미리보기</h2><button data-close>편집으로 돌아가기 ×</button></div><div class="preview-player"></div></dialog><dialog class="modal help-dialog"><div class="modal-head"><h2>편집실 사용법</h2><button data-close>닫기 ×</button></div><div class="modal-body"><p>설치 없이 쓰는 비주얼노벨 편집기입니다. 짧은 예제로 시작하거나 <strong>새 작품</strong>을 누르세요. 이전 편집기에서 저장한 프로젝트 JSON도 <strong>프로젝트 열기</strong>로 불러올 수 있습니다.</p><h3>1. 이미지와 표정 등록</h3><p><strong>캐릭터 · 이미지</strong>에서 캐릭터의 기본 이미지와 추가 표정을 올리세요. 투명 배경 PNG나 WebP가 스탠딩에 잘 맞습니다. 배경과 CG도 같은 화면에서 등록합니다.</p><h3>2. 블록으로 연출</h3><p>이미지가 나올 대사 <strong>바로 앞</strong>에 스탠딩·배경·CG 블록을 놓으세요. 스탠딩 블록 하나가 왼쪽·가운데·오른쪽 전체 배치를 정합니다. 다음 스탠딩 블록에서 표정만 바꾸거나 위치를 비우면 변경됩니다.</p><p>CG는 스탠딩 위에 표시됩니다. CG 블록에서 <strong>표시 안 함</strong>을 고르면 배경과 스탠딩이 다시 보여요. 전환 효과 블록은 그다음 대사·챕터이 나타날 때 실행됩니다. 챕터는 편집용 폴더이며 재생 화면을 초기화하지 않습니다.</p><h3>3. 위치와 움직임</h3><p>스탠딩 블록을 선택한 뒤 미리보기의 캐릭터를 드래그하세요. 가로·세로 좌표는 화면 너비·높이의 %이며, 0은 원래 자리입니다. 세로 +는 아래쪽입니다. 레이어 숫자가 클수록 앞에 보입니다. 배경·CG·대사창과의 순서는 고정됩니다.</p><p>캐릭터마다 동작·시간·반복을 설정할 수 있습니다. 동작은 이 스탠딩 블록 다음의 읽는 화면에서 한 번 실행되며 이후 대사마다 반복되지 않습니다. 다시 실행하려면 새 스탠딩 블록을 추가하세요. <strong>효과 미리보기</strong>로 바로 확인할 수 있습니다.</p><h3>4. 테마와 글자</h3><p><strong>테마 · 글자</strong>에서 대사창·강조색·제목 배경, 고딕/명조/궁서, 글자 크기·색·굵기·기울기를 바꿉니다. 대사·내레이션 블록에 개별 스타일을 지정할 수도 있습니다. 글꼴은 기기에 설치된 글꼴을 사용하며 없는 경우 대체 글꼴이 적용됩니다.</p><h3>5. 여러 블록 편집과 인라인 서식</h3><p>블록 왼쪽 체크박스 또는 Ctrl 클릭으로 여러 블록을 선택합니다. Shift 클릭은 범위를 선택합니다. 선택한 블록 중 하나를 끌면 순서를 유지한 채 함께 이동합니다. 왼쪽 챕터 이름 위에 놓으면 그 챕터 끝으로 옮깁니다. <strong>일괄 변경</strong>으로 대사 화자, 캐릭터 교체, 스탠딩 배치·표정·동작을 바꿀 수 있습니다.</p><p>대사 입력창에서 글자를 선택한 뒤 굵게·기울임·색·크기·글꼴 버튼을 누르면 해당 구간에만 태그가 붙습니다. 예: [b]굵게[/b], [color=#ff5555]붉은 글자[/color], [size=28]큰 글자[/size], [font=serif]명조[/font]. 태그는 중첩할 수 있습니다.</p><h3>6. 선택지와 분기</h3><p>갈래별 챕터을 만든 다음 선택지 블록에서 각 버튼의 이동할 곳을 고르세요. 갈래가 끝나는 곳에 <strong>엔딩</strong>을 넣거나 <strong>블록 이동</strong>으로 공통 챕터에 합칠 수 있습니다. 챕터를 지나도 실제로 지나온 갈래의 이미지 배치를 이어갑니다. 선택지와 블록 이동은 챕터를 고른 뒤 특정 블록을 지정할 수 있습니다. 뒤로가기·로그·세이브에는 선택한 경로가 반영됩니다.</p><h3>7. 저장과 공개</h3><p><strong>JSON 저장</strong>은 이미지와 편집 내용을 포함한 전체 프로젝트를 보관합니다. <strong>공개용 HTML 내보내기</strong>는 편집 기능이 없는 재생 파일을 만듭니다. 작품 공유에는 내보낸 index.html을, 편집기 공유에는 editor.html을 올리세요. 각자 만든 작품이 자동으로 다른 사람에게 공개되지는 않습니다.</p><p>작업 내용은 이 브라우저에 자동 저장됩니다. 다른 기기에서는 프로젝트 JSON을 열어 이어서 편집하세요. 독자의 <strong>세이브·로드</strong>는 읽던 위치를 JSON으로 저장하고 복원합니다.</p></div></dialog><div class="toast studio-toast" role="status" hidden></div>`;
  preview=new U.Stage($('.preview-stage'),project);
  function toast(message){const box=$('.studio-toast');box.textContent=message;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,4600);}
  function current(){return project.blocks.find(b=>b.id===selected) || project.blocks[0];}
  function scenes(){
    const result=[];project.blocks.forEach((b,i)=>{if(b.type==='scene')result.push({id:b.id,title:b.title,index:i});});
    if(!result.length || result[0].index!==0)result.unshift({id:'__first__',title:'프롤로그',index:0});
    result.forEach((s,i)=>s.end=result[i+1]?.index ?? project.blocks.length);return result;
  }
  function currentScene(){const index=project.blocks.findIndex(b=>b.id===selected);return scenes().find(s=>index>=s.index && index<s.end) || scenes()[0];}
  function record(key=''){
    const now=Date.now();if(!key || key!==lastChangeKey || now-lastChangeTime>800){undo.push(C.clone(project));if(undo.length>30)undo.shift();}
    lastChangeKey=key;lastChangeTime=now;redo=[];
  }
  function change(fn,key='',refresh='all'){
    record(key);fn();revision++;scheduleSave();if(refresh==='all')render();else{refreshPreview();refreshCard();refreshHeader();}
  }
  function refreshHeader(){
    $('.studio-title strong').textContent=project.title;
    document.title=project.title+' · HVM';
    $('[data-action="undo"]').disabled=!undo.length;$('[data-action="redo"]').disabled=!redo.length;
  }
  function describe(b){
    if(['scene','ending'].includes(b.type))return b.title;
    if(b.type==='jump')return '→ '+targetLabel(b.target);
    if(b.type==='choice')return C.plainText(b.text)+' · '+b.options.length+'개 선택지';
    if(['dialogue','narration'].includes(b.type))return C.plainText(b.text) || '내용을 입력해주세요.';
    if(b.type==='standing')return C.POSITIONS.map(pos=>{const slot=b.slots[pos],c=project.characters.find(c=>c.id===slot?.characterId),e=c?.expressions.find(e=>e.id===slot.expressionId);return POS_NAMES[pos]+': '+(c?c.name+' · '+(e?.name || '기본'):'비움');}).join(' / ');
    if(b.type==='transition')return EFFECT_NAMES[b.effect]+' · '+b.duration/1000+'초';
    return project.assets.find(a=>a.id===b.assetId)?.name || (b.type==='cg'?'CG 닫기':'기본 배경');
  }
  function blockMarkup(b,index){
    const speaker=b.type==='dialogue'?U.nameMarkup(project,b.speakers):'';
    return `<article class="block-card ${selected===b.id?'selected':''} ${multi.has(b.id)?'multi-selected':''}" data-block="${C.esc(b.id)}" draggable="true" role="listitem" tabindex="0" aria-label="${C.esc(NAMES[b.type]+' '+describe(b).slice(0,55))}" aria-current="${selected===b.id?'true':'false'}"><input class="block-pick" type="checkbox" data-pick="${C.esc(b.id)}" aria-label="${index+1}번 블록 선택" ${multi.has(b.id)?'checked':''}><span class="block-grip" title="끌어서 순서 변경" aria-hidden="true">⠿</span><div class="block-content"><div class="block-meta"><span>${String(index+1).padStart(3,'0')}</span><span class="block-type">${NAMES[b.type]}</span></div><p class="block-body">${speaker}${C.esc(describe(b))}</p></div><div class="block-options"><button data-block-action="up" title="위로 이동" aria-label="위로 이동" ${index===0?'disabled':''}>↑</button><button data-block-action="down" title="아래로 이동" aria-label="아래로 이동" ${index===project.blocks.length-1?'disabled':''}>↓</button></div></article>`;
  }
  function renderNav(){
    const all=scenes(), active=currentScene();selectedScene=active.id;
    $('.scene-total').textContent=String(all.length).padStart(2,'0');
    $('[data-chapter-title]').checked=project.settings.showChapterTitle!==false;
    $('.scene-list').innerHTML=all.map((s,i)=>`<div class="chapter-row" data-chapter="${C.esc(s.id)}"><span class="chapter-grip" title="챕터 전체 드래그">⠿</span><button class="scene-button ${s.id===selectedScene?'active':''}" data-scene="${C.esc(s.id)}"><span class="scene-num">${String(i+1).padStart(2,'0')}</span><span><strong>${C.esc(s.title)}</strong><small>${project.blocks.slice(s.index,s.end).filter(b=>b.type!=='scene').length}개 블록</small></span></button><button class="chapter-delete danger" data-delete-chapter="${C.esc(s.id)}" aria-label="${C.esc(s.title)} 챕터 삭제" title="챕터와 하위 블록 삭제">×</button></div>`).join('');
  }
  function renderBlocks(){
    const s=currentScene();$('.block-list-title').textContent=s.title;$('.block-count').textContent=`${project.blocks.slice(s.index,s.end).filter(b=>b.type!=='scene').length}개 블록`;
    $('.block-list').innerHTML=project.blocks.slice(s.index,s.end).map((b,i)=>b.type==='scene'?'':blockMarkup(b,s.index+i)).join('')||'<p class="hint">빈 챕터입니다. 위 버튼으로 블록을 추가하세요.</p>';refreshSelection();
  }
  function refreshCard(){
    const b=current(), card=$$('.block-card').find(el=>el.dataset.block===b.id);if(card){card.querySelector('.block-body').innerHTML=(b.type==='dialogue'?U.nameMarkup(project,b.speakers):'')+C.esc(describe(b));card.setAttribute('aria-label',NAMES[b.type]+' '+describe(b).slice(0,55));}
  }
  function refreshPreview(){
    compiled=C.compile(project);const index=project.blocks.findIndex(b=>b.id===selected);preview.setProject(project);
    const frame=C.clone(compiled.blockStates[Math.max(0,index)]);
    if(!['dialogue','narration','choice','ending'].includes(current().type)){
      const next=compiled.frames.find(f=>f.blockIndex>index&&f.blockIndex<currentScene().end&&['dialogue','narration'].includes(f.kind));
      frame.kind=next?.kind || 'narration';frame.text=next?.text || '';frame.speakers=next?.speakers || [];frame.textStyle=next?.textStyle||null;
    }
    preview.render(frame,true);
    updatePositioning();
    $('.preview-position').textContent=`${String(Math.max(0,index)+1).padStart(3,'0')} / ${project.blocks.length} 블록`;
  }
  function select(id,scroll=false,keepMulti=false){selected=id;if(!keepMulti){multi=new Set([id]);selectionAnchor=id;}render();if(scroll)setTimeout(()=>$$('.block-card').find(el=>el.dataset.block===selected)?.scrollIntoView({block:'nearest'}),0);}
  function render(){multi=new Set([...multi].filter(id=>project.blocks.some(b=>b.id===id)));if(!project.blocks.some(b=>b.id===selected))selected=project.blocks[0].id;refreshHeader();renderNav();renderBlocks();renderInspector();refreshPreview();}
  function opts(items,value){return items.map(([id,label])=>`<option value="${C.esc(id)}" ${id===value?'selected':''}>${C.esc(label)}</option>`).join('');}
  function effectFields(b){return `<label>전환 방식<select data-field="effect">${opts(Object.entries(EFFECT_NAMES),b.effect || 'none')}</select></label><label>효과 시간 (초)<input data-field="duration" type="number" min="0" max="6" step="0.1" value="${C.number(b.duration,0,6000,800)/1000}"></label>`;}
  function renderInspector(){
    const b=current();let html=`<h2>${NAMES[b.type]}</h2>`;
    if(b.type==='scene') html+=`<label>챕터 이름<input data-field="title" value="${C.esc(b.title)}"></label>`;
    if(b.type==='dialogue') html+=`<label>화자 <span class="muted small-text">여러 명 선택 가능</span></label><div class="speakers-checks">${project.characters.map(c=>`<label><input type="checkbox" data-speaker="${C.esc(c.id)}" ${b.speakers.includes(c.id)?'checked':''}><span>${C.esc(c.name)}</span></label>`).join('')}</div>`;

  function addBlock(type){
    const index=project.blocks.findIndex(b=>b.id===selected), id=C.uid(), state=compiled.blockStates[index]?.state;
    const b={id,type};
    if(type==='scene')Object.assign(b,{title:'새 챕터'});
    if(type==='dialogue')Object.assign(b,{speakers:current().speakers?.length?[...current().speakers]:project.characters.length?[project.characters[0].id]:[],text:''});
    if(type==='narration')b.text='';
    if(type==='choice')Object.assign(b,{text:'어떻게 할까요?',options:[{label:'첫 번째 선택',target:'__next__'},{label:'두 번째 선택',target:'__end__'}]});
    if(type==='jump')b.target='__end__';
    if(type==='ending')b.title='이야기 끝';
    if(type==='standing'){b.slots=C.clone(state?.slots || {left:null,center:null,right:null});Object.values(b.slots).filter(Boolean).forEach(slot=>slot.animation=C.motion());}
    if(type==='background')Object.assign(b,{assetId:'',fit:'cover'});
    if(type==='cg')b.assetId='';
    if(type==='transition')Object.assign(b,{effect:'fade',duration:800});
    change(()=>{project.blocks.splice(index+1,0,b);selected=id;});select(id,true);toast(NAMES[type]+' 블록을 추가했습니다.');
  }
  function move(id,delta){const from=project.blocks.findIndex(b=>b.id===id),to=from+delta;if(to<0||to>=project.blocks.length)return;change(()=>{const [b]=project.blocks.splice(from,1);project.blocks.splice(to,0,b);selected=id;});select(id,true);}
  function deleteBlocks(ids){
    const removed=new Set(ids);let disconnected=0;
    change(()=>{project.blocks=project.blocks.filter(b=>!removed.has(b.id));
      for(const b of project.blocks){if(b.type==='jump'&&removed.has(b.target)){b.target='__end__';disconnected++;}if(b.type==='choice')for(const o of b.options)if(removed.has(o.target)){o.target='__end__';disconnected++;}}
      if(!project.blocks.length)project.blocks.push({id:C.uid(),type:'scene',title:'새 챕터'});
      if(!project.blocks.some(b=>b.type==='scene'))project.blocks.unshift({id:C.uid(),type:'scene',title:'첫 챕터'});
      selected=project.blocks.find(b=>!removed.has(b.id))?.id||project.blocks[0].id;multi.clear();
    });toast('삭제했습니다. Ctrl+Z로 복구할 수 있어요.'+(disconnected?' 삭제된 곳을 가리키던 '+disconnected+'개 연결은 이야기 종료로 변경했습니다.':''));
  }

  async function readImage(file,kind){
    if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))throw new Error('PNG·JPG·WebP·GIF 이미지를 선택해주세요.');
    if(file.size>15*1024*1024)throw new Error('이미지 한 장은 15MB 이하여야 합니다.');
    const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('이미지를 읽을 수 없습니다.'));reader.readAsDataURL(file);});
    await new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=()=>reject(new Error('손상되었거나 지원하지 않는 이미지입니다.'));image.src=data;});
    return {id:C.uid(),name:file.name,kind,data};
  }

  function applyBulk(){
    const mode=$('[data-bulk-mode]').value,targets=project.blocks.filter(b=>multi.has(b.id)),speakers=$$('[data-bulk-speaker]:checked').map(e=>e.dataset.bulkSpeaker);
    const from=$('[data-bulk-from]')?.value,to=$('[data-bulk-to]')?.value,char=$('[data-bulk-character]')?.value,pos=$('[data-bulk-pos]')?.value,expression=$('[data-bulk-expression]')?.value,flip=$('[data-bulk-flip]')?.value,m=$('[data-bulk-motion]')?.value;
    const values=Object.fromEntries($$('[data-bulk-number]').filter(e=>e.value!=='').map(e=>[e.dataset.bulkNumber,e.value]));let count=0;
    const newSlot=(id,slot,position,exp)=>{
      const c=project.characters.find(c=>c.id===id);if(!c)return slot;
      if(!c.expressions.length)c.expressions.push({id:C.uid(),name:'기본',assetId:''});
      const expressionId=c.expressions.some(e=>e.id===exp)?exp:c.expressions.some(e=>e.id===slot?.expressionId)?slot.expressionId:c.expressions[0].id;
      return {...(slot||{x:0,y:0,scale:100,flip:false,layer:C.POSITIONS.indexOf(position)+1,animation:C.motion()}),characterId:id,expressionId};
    };
    if(mode==='replace'&&(!from||!to)){toast('교체할 캐릭터를 등록해주세요.');return;}
    change(()=>{
      for(const b of targets){
        if(mode==='speakers'&&b.type==='dialogue'){b.speakers=[...speakers];count++;}
        if(mode==='replace'){
          let touched=false;
          if(b.type==='dialogue'&&b.speakers.includes(from)){b.speakers=[...new Set(b.speakers.map(id=>id===from?to:id))];touched=true;}
          if(b.type==='standing')for(const p of C.POSITIONS)if(b.slots[p]?.characterId===from){b.slots[p]=newSlot(to,b.slots[p],p);touched=true;}
          if(touched)count++;
        }
        if(mode==='standing'&&b.type==='standing'){
          for(const p of pos==='all'?C.POSITIONS:[pos]){
            if(char==='__empty__'){b.slots[p]=null;continue;}
            if(char!=='__keep__')b.slots[p]=newSlot(char,b.slots[p],p,expression);
            const slot=b.slots[p];if(!slot)continue;
            for(const [key,value] of Object.entries(values))slot[key]=key==='scale'?C.number(value,20,250,100):key==='layer'?Math.round(C.number(value,1,20,1)):C.number(value,-100,100,0);
            if(flip!=='keep')slot.flip=flip==='on';
            if(m!=='__keep__')slot.animation={...C.motion(slot.animation),type:m};
          }
          count++;
        }
      }
    });$('.bulk-dialog').close();toast(count+'개 블록을 변경했습니다.');
  }
